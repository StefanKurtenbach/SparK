[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-genomics"
version = "3.2.0"
description = "Genomic BigWig and bedGraph signal plots as SVG, JPG, PNG and PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23.5,<3",
  "pyBigWig>=0.3.22,<0.4",
  "Pillow>=10,<14",
  "resvg-py>=0.5,<0.6",
  "reportlab>=4,<6",
  "svglib>=1.5,<3",
]

[project.scripts]
spark-plot = "SparK:main"

[project.urls]
Repository = "https://github.com/StefanKurtenbach/SparK"
Issues = "https://github.com/StefanKurtenbach/SparK/issues"

[tool.setuptools]
py-modules = ["SparK"]
